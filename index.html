<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LAST LIGHT</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090b;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;background:rgba(4,6,8,.88)}
.card{width:min(410px,100%);background:#0e1318;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:25px;box-shadow:0 25px 80px #000;text-align:center}
.logo{font-size:46px;line-height:.82;font-weight:1000;letter-spacing:4px;text-shadow:0 4px 0 #48151a;margin-bottom:12px}
.logo span{color:#e74c3c}
.tag{color:#aeb7bd;font-size:13px;letter-spacing:2px;font-weight:800}
.btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;background:#d9433c;color:#fff;font-weight:1000;font-size:16px;box-shadow:0 4px 0 #7e211e}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7e211e}
.btn.dark{background:#192127;box-shadow:none;border:1px solid #ffffff14}
.hidden{display:none!important}
#hud{position:fixed;z-index:8;top:env(safe-area-inset-top,8px);left:10px;right:10px;padding-top:7px;pointer-events:none}
.row{display:flex;justify-content:space-between;gap:6px}
.stat{background:#090d11dd;border:1px solid #ffffff16;border-radius:11px;padding:7px 9px;font-size:12px;font-weight:900}
#health{margin-top:7px;height:7px;background:#ffffff14;border-radius:10px;overflow:hidden}.fill{height:100%;width:100%;background:#e74c3c}
#mission{position:fixed;z-index:7;top:72px;left:50%;transform:translateX(-50%);background:#080b0dcc;border:1px solid #ffffff12;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:900;pointer-events:none;white-space:nowrap}
#touch{position:fixed;z-index:9;left:0;right:0;bottom:env(safe-area-inset-bottom,8px);height:155px;pointer-events:none}
#stick{position:absolute;left:15px;bottom:12px;width:112px;height:112px;border-radius:50%;border:2px solid #ffffff18;background:#ffffff08;pointer-events:auto}
#knob{position:absolute;left:28px;top:28px;width:52px;height:52px;border-radius:50%;background:#ffffff20;border:1px solid #ffffff2b}
#actions{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.action{width:68px;height:68px;border:0;border-radius:50%;background:#26343f;color:#fff;font-size:11px;font-weight:1000;border:1px solid #ffffff20}
#fire{width:86px;height:86px;background:#d9433c}
#dash{background:#2980b9}
#reload{background:#34495e}
#pause{position:fixed;z-index:11;right:12px;top:58px;width:36px;height:36px;border:0;border-radius:10px;background:#ffffff12;color:#fff;font-weight:900}
#pauseMenu{position:fixed;z-index:30;inset:0;background:#050607ee;display:flex;align-items:center;justify-content:center;padding:20px}
.small{font-size:12px;color:#8e9aa2;line-height:1.5}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
 <div class="row">
  <div class="stat">DAY <b id="day">1</b></div>
  <div class="stat">💰 <b id="cash">0</b></div>
  <div class="stat">☠ <b id="kills">0</b></div>
  <div class="stat">🔫 <b id="ammo">12</b>/<b id="reserve">48</b></div>
 </div>
 <div id="health"><div class="fill" id="hp"></div></div>
</div>
<div id="mission" class="hidden">CLEAR THE STREET</div>
<button id="pause" class="hidden">Ⅱ</button>

<div id="touch" class="hidden">
 <div id="stick"><div id="knob"></div></div>
 <div id="actions">
  <button class="action" id="dash">DASH</button>
  <button class="action" id="reload">RELOAD</button>
  <button class="action" id="fire">FIRE</button>
 </div>
</div>

<div id="menu" class="screen">
 <div class="card">
  <div class="logo">LAST<br><span>LIGHT</span></div>
  <div class="tag">A MINI ZOMBIE SURVIVAL GAME</div>
  <p class="small">The city went dark three nights ago. Your radio is dead. Your ammo isn't infinite. Keep moving.</p>
  <button class="btn" id="play">START NIGHT</button>
  <button class="btn dark" id="instructions">HOW TO SURVIVE</button>
 </div>
</div>

<div id="pauseMenu" class="hidden">
 <div class="card">
  <div class="logo" style="font-size:35px">NIGHT<br><span>PAUSED</span></div>
  <button class="btn" id="resume">RESUME</button>
  <button class="btn dark" id="quit">QUIT TO MENU</button>
 </div>
</div>

<div id="shop" class="screen hidden">
 <div class="card">
  <div class="tag">SAFEHOUSE</div>
  <div class="logo" style="font-size:34px">NIGHT <span id="shopDay">2</span></div>
  <p class="small">Cash: $<b id="shopCash">0</b></p>
  <button class="btn" id="damage">🔴 HEAVY AMMO — $75</button>
  <button class="btn" id="speed">⚡ FAST HANDS — $90</button>
  <button class="btn" id="armour">🛡 ARMOUR — $110</button>
  <button class="btn" id="medkit">❤ MEDKIT — $50</button>
  <button class="btn dark" id="continue">LEAVE SAFEHOUSE</button>
 </div>
</div>

<div id="gameover" class="screen hidden">
 <div class="card">
  <div class="logo" style="font-size:38px">YOU<br><span>DIED</span></div>
  <p class="small">You survived until Day <b id="finalDay">1</b><br>Score: <b id="finalScore">0</b></p>
  <button class="btn" id="again">TRY AGAIN</button>
  <button class="btn dark" id="home">MAIN MENU</button>
 </div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const $=id=>document.getElementById(id);
let playing=false,paused=false,day=1,cash=0,kills=0,score=0,ammo=12,reserve=48,damage=1,fireDelay=300,maxHP=100,hp=100;
let zombies=[],shots=[],drops=[],sparks=[],spawnClock=0,required=8,cleared=0,shake=0;
let p={x:W/2,y:H*.55,r:15,dx:0,dy:0,fire:0,dash:0};
let last=0;

function hud(){ $('day').textContent=day;$('cash').textContent=cash;$('kills').textContent=kills;$('ammo').textContent=ammo;$('reserve').textContent=reserve;$('hp').style.width=Math.max(0,hp/maxHP()*100)+'%'; }
function maxHP(){return maxHPValue}
let maxHPValue=100;
function toast(t){$('mission').textContent=t;$('mission').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>{$('mission').classList.add('hidden')},1300)}
function burst(x,y,n=7){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*3+1;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:22})}}

function reset(){day=1;cash=0;kills=0;score=0;ammo=12;reserve=48;damage=1;fireDelay=300;maxHPValue=100;hp=100;zombies=[];shots=[];drops=[];sparks=[];p.x=W/2;p.y=H*.55;p.dx=p.dy=0;p.fire=p.dash=0}
function start(){reset();$('menu').classList.add('hidden');$('gameover').classList.add('hidden');$('hud').classList.remove('hidden');$('touch').classList.remove('hidden');$('pause').classList.remove('hidden');playing=true;paused=false;beginDay();last=performance.now();requestAnimationFrame(loop)}
$('play').onclick=start;$('again').onclick=start;
$('instructions').onclick=()=>alert('Use the left joystick to move. FIRE shoots where you are moving; if you stand still it shoots upward. RELOAD restores ammo. DASH is your emergency escape. Clear each night, collect supply drops, then spend cash in the safehouse. Runners are fast. Brutes are tough. Keep moving!');
$('pause').onclick=()=>{if(!playing)return;paused=true;$('pauseMenu').classList.remove('hidden')};
$('resume').onclick=()=>{paused=false;$('pauseMenu').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)};
$('quit').onclick=()=>{playing=false;$('pauseMenu').classList.add('hidden');$('hud').classList.add('hidden');$('touch').classList.add('hidden');$('pause').classList.add('hidden');$('menu').classList.remove('hidden')};
$('home').onclick=()=>{$('gameover').classList.add('hidden');$('menu').classList.remove('hidden')};

function beginDay(){required=7+day*3;cleared=0;zombies=[];spawnClock=300;toast('NIGHT '+day+' — '+required+' TO CLEAR')}
function spawnZombie(){
 let side=Math.floor(Math.random()*4),m=30,q=Math.random(),e={x:0,y:0,r:16,hp:2+Math.floor(day/4),speed:.65+day*.045,type:0};
 if(q<.18){e.type=1;e.r=11;e.hp=1;e.speed=1.35+day*.06}
 if(q<.045&&day>=3){e.type=2;e.r=25;e.hp=8+day;e.speed=.35+day*.02}
 if(side===0){e.x=Math.random()*W;e.y=-m}else if(side===1){e.x=W+m;e.y=Math.random()*H}else if(side===2){e.x=Math.random()*W;e.y=H+m}else{e.x=-m;e.y=Math.random()*H}
 zombies.push(e)
}
function fire(){
 if(!playing||paused||ammo<=0||p.fire>0)return;
 ammo--;p.fire=fireDelay;
 let dx=p.dx,dy=p.dy;if(!dx&&!dy)dy=-1;
 let a=Math.atan2(dy,dx);
 shots.push({x:p.x,y:p.y,vx:Math.cos(a)*10,vy:Math.sin(a)*10,r:4,d:damage});
 burst(p.x,p.y-8,3);hud()
}
function reload(){if(ammo>=12||reserve<=0)return;let n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;hud();toast('MAGAZINE READY')}
function dash(){if(p.dash>0)return;p.dash=180;p.x+=p.dx*110;p.y+=p.dy*110;p.x=Math.max(22,Math.min(W-22,p.x));p.y=Math.max(72,Math.min(H-115,p.y));burst(p.x,p.y,14)}
$('fire').onpointerdown=e=>{e.preventDefault();fire()};$('reload').onpointerdown=e=>{e.preventDefault();reload()};$('dash').onpointerdown=e=>{e.preventDefault();dash()};

let stickActive=false,sx=0,sy=0;
$('stick').onpointerdown=e=>{stickActive=true;sx=e.clientX;sy=e.clientY;$('stick').setPointerCapture(e.pointerId);moveStick(e)}
$('stick').onpointermove=e=>{if(stickActive)moveStick(e)}
$('stick').onpointerup=()=>{stickActive=false;p.dx=p.dy=0;$('knob').style.left='28px';$('knob').style.top='28px'}
function moveStick(e){let dx=e.clientX-sx,dy=e.clientY-sy,l=Math.hypot(dx,dy),m=42;if(l>m){dx=dx/l*m;dy=dy/l*m}p.dx=dx/m;p.dy=dy/m;$('knob').style.left=(28+dx)+'px';$('knob').style.top=(28+dy)+'px'}

addEventListener('keydown',e=>{
 let k=e.key.toLowerCase();
 if(k==='r')reload();if(k===' ')fire();if(k==='shift')dash();
 let dx=(k==='d'||k==='arrowright'?1:0)-(k==='a'||k==='arrowleft'?1:0);
 let dy=(k==='s'||k==='arrowdown'?1:0)-(k==='w'||k==='arrowup'?1:0);
 if(dx||dy){p.dx=dx;p.dy=dy}
});

function update(dt){
 p.x+=p.dx*3.9*dt;p.y+=p.dy*3.9*dt;p.x=Math.max(20,Math.min(W-20,p.x));p.y=Math.max(68,Math.min(H-112,p.y));
 p.fire=Math.max(0,p.fire-16.67*dt);p.dash=Math.max(0,p.dash-16.67*dt);
 spawnClock-=16.67*dt;
 if(spawnClock<=0&&cleared<required&&zombies.length<7+Math.floor(day/2)){spawnZombie();spawnClock=Math.max(150,620-day*25)}
 for(const b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt}
 for(let i=shots.length-1;i>=0;i--)if(shots[i].x<-40||shots[i].x>W+40||shots[i].y<-40||shots[i].y>H+40)shots.splice(i,1);

 for(let i=zombies.length-1;i>=0;i--){
  let e=zombies[i],a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;
  let dead=false;
  for(let j=shots.length-1;j>=0;j--){let b=shots[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){e.hp-=b.d;shots.splice(j,1);burst(e.x,e.y,2);if(e.hp<=0){let reward=e.type===2?55:e.type===1?15:8;cash+=reward;kills++;score+=reward*10;cleared++;if(Math.random()<.2)drops.push({x:e.x,y:e.y});burst(e.x,e.y,12);zombies.splice(i,1);dead=true;break}}}
  if(dead)continue;
  if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){hp-=e.type===2?22:10;zombies.splice(i,1);shake=8;burst(p.x,p.y,10);if(hp<=0){die();return}}
 }
 for(let i=drops.length-1;i>=0;i--){let d=drops[i];if(Math.hypot(p.x-d.x,p.y-d.y)<28){cash+=30;reserve=Math.min(120,reserve+12);drops.splice(i,1);toast('SUPPLY CRATE +$30')}}
 for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.96;s.vy*=.96;s.l-=dt}
 sparks=sparks.filter(s=>s.l>0);
 if(cleared>=required&&zombies.length===0)openShop();
 hud()
}
function openShop(){playing=false;$('touch').classList.add('hidden');$('pause').classList.add('hidden');$('shop').classList.remove('hidden');$('shopDay').textContent=day+1;$('shopCash').textContent=cash;shopButtons()}
function shopButtons(){$('damage').disabled=cash<75;$('speed').disabled=cash<90;$('armour').disabled=cash<110;$('medkit').disabled=cash<50}
function buy(cost,fn){if(cash<cost)return;cash-=cost;fn();$('shopCash').textContent=cash;shopButtons()}
$('damage').onclick=()=>buy(75,()=>{damage+=.5});
$('speed').onclick=()=>buy(90,()=>{fireDelay=Math.max(110,fireDelay-45)});
$('armour').onclick=()=>buy(110,()=>{maxHPValue+=25;hp=maxHPValue});
$('medkit').onclick=()=>buy(50,()=>{hp=Math.min(maxHPValue,hp+50)});
$('continue').onclick=()=>{$('shop').classList.add('hidden');$('touch').classList.remove('hidden');$('pause').classList.remove('hidden');day++;playing=true;beginDay();last=performance.now();requestAnimationFrame(loop)};

function die(){playing=false;$('touch').classList.add('hidden');$('pause').classList.add('hidden');$('hud').classList.add('hidden');$('finalDay').textContent=day;$('finalScore').textContent=score;$('gameover').classList.remove('hidden')}
function draw(){
 ctx.save();
 if(shake>1){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}
 ctx.fillStyle='#080b0f';ctx.fillRect(0,0,W,H);
 // street
 ctx.fillStyle='#10161a';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#172126';ctx.lineWidth=1;
 for(let xx=0;xx<W;xx+=45){ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,H);ctx.stroke()}
 for(let yy=0;yy<H;yy+=45){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}
 // street lights / windows
 for(let i=0;i<8;i++){let xx=(i*137+50)%W;ctx.fillStyle='#d6a64a14';ctx.fillRect(xx,90,24,40)}
 drops.forEach(d=>{ctx.fillStyle='#e9c46a';ctx.fillRect(d.x-9,d.y-8,18,16);ctx.fillStyle='#fff2a8';ctx.fillRect(d.x-2,d.y-5,4,10)});
 shots.forEach(b=>{ctx.fillStyle='#ffd166';ctx.shadowBlur=10;ctx.shadowColor='#ffd166';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0});
 zombies.forEach(e=>{
  ctx.fillStyle=e.type===2?'#7b1e24':e.type===1?'#673b75':'#294331';
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
  ctx.fillStyle='#ef5350';ctx.beginPath();ctx.arc(e.x-5,e.y-3,2,0,7);ctx.arc(e.x+5,e.y-3,2,0,7);ctx.fill();
 });
 sparks.forEach(s=>{ctx.globalAlpha=s.l/22;ctx.fillStyle='#e74c3c';ctx.fillRect(s.x,s.y,3,3);ctx.globalAlpha=1});
 ctx.save();ctx.translate(p.x,p.y);ctx.shadowBlur=18;ctx.shadowColor='#4bb8e8';
 ctx.fillStyle='#233945';ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();
 ctx.fillStyle='#55b7e8';ctx.fillRect(-5,-5,10,4);
 ctx.fillStyle='#bbc7cd';ctx.fillRect(-3,-27,6,18);ctx.restore();
 ctx.restore()
}
function loop(t){if(!playing)return;if(paused)return;let dt=Math.min(2,(t-last)/16.67);last=t;update(dt);draw();requestAnimationFrame(loop)}
draw();
</script>
</body>
</html>
